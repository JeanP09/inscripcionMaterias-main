server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los CSV de oferta/matriz se envían al backend como multipart. El límite
    # por defecto de Nginx (1 MB) puede quedarse corto para la oferta.
    client_max_body_size 10m;

    # DNS interno de Docker: permite re-resolver el nombre "backend" si el
    # contenedor se reinicia y cambia de IP (evita 502 por IP obsoleta).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy de la API hacia el servicio "backend" por la red interna de Docker.
    # El frontend llama a rutas relativas /api/... (mismo origen), así que no
    # hay CORS ni depende de en qué host/puerto se abra la SPA.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA: cualquier ruta del cliente resuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
